[package]
name = "aid-contract"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
# "rlib" is required (alongside "cdylib") so the `testing` crate's
# cross-contract fuzzing harness (Issue #191) can depend on this crate as
# a normal Rust library and exercise the real contract logic directly.
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
shared = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }